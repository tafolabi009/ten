[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-eigenstate-networks"
version = "1.0.0"
description = "Temporal Eigenstate Networks (TEN) - A novel O(T) complexity architecture for sequence modeling"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TEN Research Team"}
]
keywords = ["deep-learning", "transformers", "sequence-modeling", "drug-discovery", "efficient-attention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
    "datasets>=2.14.0",
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.7.0",
    "optax>=0.1.7",
]
drug-discovery = [
    "rdkit>=2023.3.1",
    "ogb>=1.3.6",
    "deepchem>=2.7.1",
    "torch-geometric>=2.3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
all = [
    "temporal-eigenstate-networks[jax,drug-discovery,dev]"
]

[project.urls]
Homepage = "https://github.com/genovotechnologies/temporal-eigenstate-networks"
Documentation = "https://github.com/genovotechnologies/temporal-eigenstate-networks#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ten*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=ten --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
